# Big Red Racing (1996) reference captures: the original, as shipped, for comparing the remaster.
# Copy to Tools/dosbox-x/brr.conf next to the portable DOSBox-X (git-ignored), fix the paths to your
# checkout and copy the rip's RACING folder into Tools/dosbox-x/c/. See README "Reference captures".
[sdl]
windowresolution=1280x800
output=surface
[dosbox]
machine=svga_s3
memsize=32
captures=D:\Git\BiggerRedRacing\Tools\dosbox-x\captures
[render]
scaler=none
aspect=true
[cpu]
core=dynamic
cputype=pentium
cycles=fixed 90000
[sblaster]
sbtype=none
[autoexec]
mount c "D:\Git\BiggerRedRacing\Tools\dosbox-x\c"
imgmount d "D:\Git\BiggerRedRacing\Tools\dosbox-x\brr.cue" -t cdrom
c:
cd \RACING
RACING -CFG CLAUDE -NOSOUND -LEV WATER1
